name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Needs the macOS 26 SDK: upstream uses NSGlassEffectView (Liquid Glass).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unit tests
        run: |
          xcodebuild test \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -destination 'platform=macOS' \
            -skip-testing:MaccyUITests \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
