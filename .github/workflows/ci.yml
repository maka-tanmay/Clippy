name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Needs the macOS 26 SDK: upstream uses NSGlassEffectView (Liquid Glass).
    runs-on: macos-26
    # The compile is the CI gate. Running the unit tests launches the full
    # menu-bar app as a test host, which hangs on the headless runner waiting
    # on the window server / permission prompts — so tests run locally
    # (xcodebuild test) on every change, not here. The timeout bounds any hang.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild build \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
